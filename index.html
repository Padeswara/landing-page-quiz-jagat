<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Fakta atau Opini? — Kuis</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game" aria-label="Kuis fakta dan opini">
      <section
        id="welcome"
        class="screen welcome"
        aria-labelledby="welcome-title"
      >
        <h1 id="welcome-title">
          <img
            class="welcome-logo"
            src="img/logo-opening.png"
            alt="Fakta atau Opini? Yuk asah pengetahuanmu! Biar ga cuma paham, tapi memaknai lebih dalam. Temukan mana fakta dan mana opini!"
            width="2067"
            height="2010"
          />
        </h1>
        <img
          class="welcome-character"
          src="img/char-opening.png"
          alt=""
          width="1239"
          height="1298"
        />
        <button id="start" class="welcome-start" type="button" aria-label="Mulai quiz">
          <img src="img/start-button.png" alt="" width="1467" height="429" />
        </button>
      </section>

      <section
        id="instruction"
        class="screen instruction"
        hidden
        tabindex="-1"
        aria-label="Cara bermain. Kuis akan dimulai dalam 3 detik."
      >
        <img
          src="img/instruction.png"
          alt="Swipe kiri untuk opini. Swipe kanan untuk fakta."
        />
      </section>

      <section
        id="play"
        class="screen play"
        hidden
        aria-label="Pertanyaan kuis"
      >
        <img class="play-character play-character-1" src="img/char-1.png" alt="" draggable="false" />
        <img class="play-character play-character-2" src="img/char-2.png" alt="" draggable="false" />
        <img class="play-book" src="img/book.png" alt="" draggable="false" />
        <div class="card-stage">
          <div class="card-under card-under-middle" aria-hidden="true"></div>
          <article
            id="next-question-card"
            class="question-card card-under-front question-preview"
            aria-hidden="true"
            inert
            hidden
          >
            <p id="next-question-text"></p>
            <div class="card-bottom">
              <span>BACA. PIKIR. PILIH.</span>
            </div>
          </article>
          <article
            id="question-card"
            class="question-card"
            tabindex="0"
            aria-label="Kartu pertanyaan. Gunakan panah kiri untuk fakta atau panah kanan untuk opini."
          >
            <p id="question-text" aria-live="polite"></p>
            <div class="card-bottom">
              <span>BACA. PIKIR. PILIH.</span>
            </div>
          </article>
        </div>
        <div class="answer-buttons">
          <button id="fact" class="answer fact" type="button" aria-label="Jawab fakta">
            <img src="img/swipe-fakta.png" alt="Swipe kiri untuk fakta" draggable="false" />
          </button>
          <button id="opinion" class="answer opinion" type="button" aria-label="Jawab opini">
            <img src="img/swipe-opini.png" alt="Swipe kanan untuk opini" draggable="false" />
          </button>
        </div>
      </section>

      <section
        id="result"
        class="screen result"
        hidden
        aria-label="Hasil kuis"
      >
        <div class="result-logo">
          <img src="img/logo-closing.png" alt="Quiz selesai!" />
        </div>
        <div class="result-character-wrapper">
          <img class="result-character" data-character="terkecoh" src="img/char-closing-terkecoh.png" alt="Si gampang terkecoh" />
        </div>
        <p id="result-message">Kadang fakta dan opini memang bikin bingung. Yuk, baca lebih jeli dan coba lagi!</p>
        <div class="result-score" hidden>
          <span class="result-score-label">Total Skor</span>
          <strong id="final-score">0</strong>
        </div>
        <dl class="result-breakdown" hidden>
          <div><dt>Benar</dt><dd id="correct-count">0</dd></div>
          <div><dt>Salah</dt><dd id="incorrect-count">0</dd></div>
        </dl>
        <div class="result-actions">
          <section class="result-share" aria-label="Bagikan hasil kuis" hidden>
            <p>Bagikan hasilnya dan ajak teman-temanmu untuk mengikuti quiz ini!</p>
            <div class="share-icons">
              <button type="button" data-share="whatsapp" aria-label="Bagikan ke WhatsApp"><img src="img/whatsapp.svg" alt="" /></button>
              <button type="button" data-share="x" aria-label="Bagikan ke X"><img src="img/x.svg" alt="" /></button>
              <button type="button" data-share="facebook" aria-label="Bagikan ke Facebook"><img src="img/facebook.svg" alt="" /></button>
              <button type="button" data-share="instagram" aria-label="Bagikan ke Instagram"><img src="img/instagram.svg" alt="" /></button>
            </div>
            <p id="share-status" role="status" aria-live="polite"></p>
          </section>
        <button id="restart" class="result-restart" type="button" aria-label="Main lagi">
          <img src="img/play-again-button.png" alt="" />
        </button>
        </div>
      </section>

      <dialog
        id="feedback"
        aria-labelledby="feedback-title"
        aria-describedby="feedback-description"
      >
        <div class="feedback-visual">
          <img id="feedback-image" class="feedback-image" alt="" hidden />
          <p id="feedback-description" hidden></p>
        </div>
        <div id="feedback-text">
        <div id="feedback-icon" class="feedback-icon" aria-hidden="true"></div>
        <p class="eyebrow">JAWABANMU</p>
        <h2 id="feedback-title"></h2>
        </div>
        <button id="next" class="next-image-button" type="button" aria-label="Soal berikutnya">
          <img src="img/button-next-question.png" alt="" />
        </button>
      </dialog>
    </main>
  </body>
</html>
